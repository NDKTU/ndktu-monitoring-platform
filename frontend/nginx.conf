# Serves the built SPA. Listens on 5173 so the host nginx keeps proxying to the
# same port it always has — no change needed to the server's site config.
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The edge proxy in front of this deployment truncates any single response
    # over ~104 KiB. Compression keeps every asset far below that.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Hashed filenames — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routes are client-side; anything unknown falls back to the entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

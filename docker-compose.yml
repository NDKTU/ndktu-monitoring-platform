services:
  database:
    image: postgres:17-alpine
    container_name: ndktu_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: camera_base
      POSTGRES_USER: bekzod
      POSTGRES_PASSWORD: qwerty
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # localhost only — not public
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bekzod -d camera_base"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: ndktu_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      APP__DATABASE__HOST: database        # override localhost -> compose service name
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"   # localhost only — reachable via nginx
    depends_on:
      database:
        condition: service_healthy
    volumes:
      # Captured frames live in the project tree, not in a Docker volume, so they can
      # be read, backed up and served straight from backend/uploads (git-ignored).
      - ./backend/uploads:/backend/uploads

  frontend:
    build:
      context: ./frontend
      target: prod                       # static build behind nginx, not `vite dev`
      args:
        VITE_API_URL: /api               # baked into the bundle at build time
    container_name: ndktu_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"  # localhost only — reachable via nginx
    depends_on:
      - backend

volumes:
  postgres_data:

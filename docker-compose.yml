services:
  database:
    image: postgres:17-alpine
    container_name: ndktu_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${name:-camera_base}
      POSTGRES_USER: ${user:-bekzod}
      POSTGRES_PASSWORD: ${password:-qwerty}
    ports:
      - "${port:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: ndktu_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${pgadmin_email:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${pgadmin_password:-admin}
    ports:
      - "${pgadmin_port:-5050}:80"
    depends_on:
      - database

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ndktu_backend
    restart: always
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/backend/uploads
    depends_on:
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s

volumes:
  postgres_data:        
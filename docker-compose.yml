services:
  database:
    image: postgres:17-alpine
    container_name: ndktu_db
    restart: always
    environment:
      POSTGRES_DB: camera_base
      POSTGRES_USER: bekzod
      POSTGRES_PASSWORD: qwerty
    ports:
      - "${port:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: ndktu_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${pgadmin_port:-5050}:80"
    depends_on:
      - database



volumes:
  postgres_data:        
# NDKTU Monitoring Platform — frontend only
# Serves the Vite frontend. The backend is NOT exposed here.
# Install: copy to /etc/nginx/sites-available/ and symlink into sites-enabled.

# WebSocket upgrade map: "upgrade" only for real WebSocket requests,
# empty for normal requests. Hardcoding "upgrade" everywhere corrupts
# normal responses (NS_ERROR_CORRUPTED_CONTENT in Firefox).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name face.api.nsumt.uz;

    location / {
        proxy_pass http://127.0.0.1:5173;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Vite HMR) — upgrade only when the client asks for it
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

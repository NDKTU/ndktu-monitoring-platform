services:
  database:
    image: postgres:17-alpine
    container_name: ndktu_db
    restart: always
    environment:
      POSTGRES_DB: camera_base
      POSTGRES_USER: bekzod
      POSTGRES_PASSWORD: qwerty
    ports:
      - "${port:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ndktu_backend
    restart: always
    env_file: ./backend/.env
    environment:
      APP__DATABASE__HOST: database   # override localhost -> compose service name
    ports:
      - "8000:8000"                   # browser frontend calls http://localhost:8000
    depends_on:
      - database
    volumes:
      - uploads_data:/backend/uploads # persist uploaded images

  frontend:
    build: ./frontend
    container_name: ndktu_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
